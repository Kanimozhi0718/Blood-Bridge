<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact</title>
<link rel="stylesheet" href="">
<style>
body {
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  background: #fff;
  color: #333;
  overflow-x: hidden;
}

/* Header */
header {
 height: 10vh;
    display:flex;
    align-items:center;
     font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: rgb(244, 240, 240,0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  
}

header b{
  color: red;
}
nav{
    padding-left: 14%;
}

nav a {
   margin: 0 10px;
  text-decoration: none;
  color: #333;
}

nav a:hover {
   color: red;
}

button{
    width:80px;
    height:35px;
    border:2px solid red;
    border-radius:10px;
    cursor:pointer;
    
}

button:hover{
    background:red;
    color:white;
}

/* Banner */
.banner {
  width: 100vw;
  height: 20vh;
  margin-top: 10vh;
  background: red;
  color: white;
 display: flex;
align-items: center;
justify-content: center;
font-family: Georgia, 'Times New Roman', Times, serif;
}

/* Contact page */
.contact-section {
  max-width: 1000px;
  margin: 30px auto 40px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 25px;
}

.contact-form-box {
  border: 1px solid #eee;
  border-radius: 10px;
  padding: 25px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: box-shadow 0.3s ease;
}

.contact-form-box:hover {
  box-shadow: 0 8px 22px rgba(0,0,0,0.15);
}

.contact-form-box label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
}

.contact-form-box input,
.contact-form-box textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.contact-form-box textarea {
  resize: vertical;
}

.contact-form-box input:focus,
.contact-form-box textarea:focus {
  border-color: #d21f3c;
  outline: none;
  box-shadow: 0 0 0 3px rgba(210, 31, 60, 0.15);
}

.contact-info-box {
  border: 1px solid #eee;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.map-box {
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 15px;
}

.contact-info-box h3 {
  margin-top: 20px;
  margin-bottom: 8px;
}

.contact-info-box p {
  margin: 4px 0;
  font-size: 14px;
  color: #555;
}

.social-icons {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.social-icons a {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #fde8ea;
  color: #d21f3c;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
}


.social-icons a:hover {
  background: #d21f3c;
  color: white;
  transform: translateY(-3px);
}



.btn button{
    width: 130px;
}

/* Footer */
footer {
  text-align: center;
  padding: 20px;
  background:red;
  color: white;
  margin-top: 30px;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

header{
    animation:slideDown 0.8s ease;
}

@keyframes slideDown{
    from{
        transform:translateY(-100%);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.banner{
    animation:fadeDown 1s ease;
}

@keyframes fadeLeft{
    from{
        opacity:0;
        transform:translateX(-40px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.banner h1{
    animation:zoomIn 1s ease;
}

@keyframes zoomIn{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.contact-form-box{
    animation:fadeLeft 1s ease;
}

nav a{
    transition:0.3s;
}

nav a:hover{
    color:red;
    transform:translateY(-3px);
}


@media (max-width:768px){

header{
    flex-wrap:wrap;
    height:auto;
    justify-content:center;
    padding:15px;
}

header h1{
    font-size:24px;
}

nav{
    padding-left:0;
    margin-top:10px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.banner{
    margin-top:160px;
}

.contact-section{
    grid-template-columns:1fr;
}

.contact-form-box,
.contact-info-box{
    width:100%;
}

iframe{
    height:250px;
}

}

@media (max-width:480px){

header img{
    width:70px;
}

header h1{
    font-size:20px;
}

nav{
    flex-direction:column;
    align-items:center;
    gap:8px;
}

nav a{
    display:block;
}

.banner{
    height:120px;
    margin-top:260px;
}

.banner h1{
    font-size:28px;
}

.contact-section{
    padding:15px;
}

.contact-form-box,
.contact-info-box{
    padding:15px;
}

.contact-form-box input,
.contact-form-box textarea{
    font-size:14px;
}

button{
    width:100%;
}

.social-icons{
    justify-content:center;
}

iframe{
    height:200px;
}

footer{
    font-size:14px;
}

}

</style>
</head>
