<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  overflow-x: hidden;
  background: #fff;
  color: #333;
}

html{
    scroll-behavior:smooth;
}

/* Header */
header {
  height: 10vh;
    display:flex;
    align-items:center;
     font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: rgb(244, 240, 240,0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  
}

header b{
  color: red;
}

nav{
    padding-left: 14%;
}

nav a {
  margin: 0 10px;
  text-decoration: none;
  color: #333;
}

nav a:hover {
  color: red;
}



button{
    width:80px;
    height:35px;
    border:2px solid red;
    border-radius:10px;
    cursor:pointer;
    
}

.nav-btn{
    padding-left: 1% ;
    margin-left: 10px;
}

button:hover{
    background:red;
    color:white;
}


/* Buttons */
.btn-red {
  background: red;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
}

.btn-red:hover {
  background: #db1634;
  transform: translateY(-2px);
  box-shadow: 0 5px 12px rgba(210, 31, 60, 0.35);
}

.btn-red:active {
  transform: translateY(0);
}

.btn-outline {
  background: white;
  color: red;
  border: 1px solid red;
  padding: 10px 18px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
}

.btn-outline:hover {
  background: #db1634;
  color: white;
  transform: translateY(-2px);
}

.btn-outline:active {
  transform: translateY(0);
}

/* Banner */
.banner {
  width: 100vw;
  height: 20vh;
  margin-top: 10vh;
  background: red;
  color: white;
 display: flex;
align-items: center;
justify-content: center;
font-family: Georgia, 'Times New Roman', Times, serif;
 
}

/* Search box (find-donor page) */
.search-box {
  max-width: 700px;
  margin: 30px auto;
  padding: 20px;
  border: 1px solid #eee;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  transition: box-shadow 0.3s ease;
}

.search-box:hover {
  box-shadow: 0 8px 22px rgba(0,0,0,0.15);
}

.search-box select {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.search-box select:focus {
  border-color: #d21f3c;
  outline: none;
  box-shadow: 0 0 0 3px rgba(210, 31, 60, 0.15);
}

/* Donor list */
.donor-section {
  max-width: 700px;
  margin: 0 auto 40px;
  padding: 0 20px;
}

.donor-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #eee;
  border-radius: 10px;
  padding: 15px 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  flex-wrap: wrap;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.donor-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.donor-info h3 {
  margin: 0 0 5px 0;
}

.donor-info p {
  margin: 2px 0;
  color: #555;
  font-size: 14px;
}

.available {
  background: #e7f8ee;
  color: #1c9e5a;
  font-size: 12px;
  font-weight: bold;
  padding: 3px 10px;
  border-radius: 20px;
  transition: transform 0.2s ease;
}

.donor-card:hover .available {
  transform: scale(1.05);
}

.donor-buttons button {
  margin-left: 10px;
}
.btn button{
    width: 150px;
}

#errorMessage {
  text-align: center;
  color: red;
  font-weight: bold;
  margin: 15px 0;
}

/* Footer */
footer {
  text-align: center;
  padding: 20px;
  background:red;
  color: white;
  margin-top: 30px;
}

header{
    animation:slideDown 0.8s ease;
}

@keyframes slideDown{
    from{
        transform:translateY(-100%);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}


.banner h1{
    animation:zoomIn 1s ease;
}

@keyframes zoomIn{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.search-box{
    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.donor-card{
    animation:cardShow 1s ease;
}

@keyframes cardShow{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


@media(max-width:992px){

    header{
        flex-wrap:wrap;
        height:auto;
        padding:10px;
    }

    nav{
        width:100%;
        padding-left:0;
        text-align:center;
        margin-top:10px;
    }

    nav a{
        display:inline-block;
        margin:8px;
    }

    .search-box{
        width:90%;
    }

    .donor-section{
        width:90%;
    }

}

/* Mobile */
@media(max-width:768px){

    header{
        flex-direction:column;
        justify-content:center;
    }

    .banner{
        margin-top:150px;
    }

    .search-box{
        flex-direction:column;
        width:90%;
    }

    .search-box select,
    .search-box button{
        width:100%;
    }

    .donor-card{
        flex-direction:column;
        text-align:center;
    }

    .donor-buttons{
        margin-top:15px;
    }

    .donor-buttons button{
        width:120px;
        margin:5px;
    }

    footer{
        font-size:14px;
    }

}

/* Small Mobile */
@media(max-width:480px){

    .banner h1{
        font-size:28px;
    }

    nav a{
        display:block;
        margin:10px 0;
    }

    .donor-info h3{
        font-size:18px;
    }

    .donor-info p{
        font-size:13px;
    }

}

</style>

<body>
    

  <!-- Header -->
  <header>
    <img src="images/blood.png" alt="logo" width="100px">
    <h1>Blood<b>Bridge</b></h1>

    <nav>
      <a href="Home1.html">Home</a>
      <a href="About1.html">About</a>
      <a href="Donar.html">Donate</a>
      <a href="FindDonar1.html">FindDonor</a>
      <a href="Emergency1.html">Emergency</a>
      <a href="Gallery1.html">Gallery</a>
      <a href="blog1.html">Blog</a>
      <a href="contact1.html">Contact</a>
    </nav>
  </header>

  <!-- Page Title -->
  <div class="banner">
    <h1>Find Donor</h1>
  </div>

  <!-- Search Box -->
  <div class="search-box">

    <select id="bloodGroup">
      <option value="">Select Blood Group</option>
      <option>A+</option>
      <option>A-</option>
      <option>B+</option>
      <option>B-</option>
      <option>AB+</option>
      <option>AB-</option>
      <option>O+</option>
      <option>O-</option>
    </select>

    <select id="city">
      <option value="">Select City</option>
    </select>

    <button class="btn-red" id="searchBtn">Search</button>

  </div>

  <!-- Error Message -->
  <p id="errorMessage"></p>

  <!-- Donor List (built dynamically from localStorage "donors") -->
  <div class="donor-section" id="donorSection">

    <h2>Available Donors</h2>

    <div id="donorCardsWrap"></div>

    <p id="noDonorsMsg" style="text-align:center; color:gray; display:none;">
      No donors registered yet.
    </p>

  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 BloodBridge. All rights reserved.</p>
  </footer>

</body>

<script>
/* =========================================================
   FIND DONOR PAGE
   Reads the SAME "donors" key from localStorage that:
     - script1.js WRITES to when someone registers (Donar.html)
     - Admin.js DELETES from in the admin dashboard
   So new registrations appear here instantly, and donors
   deleted by admin disappear here instantly too — no extra
   sync logic required, just always read fresh from storage.
   ========================================================= */

function getDonors() {
    return JSON.parse(localStorage.getItem("donors")) || [];
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text == null ? "" : text;
    return div.innerHTML;
}

const donorCardsWrap = document.getElementById("donorCardsWrap");
const noDonorsMsg = document.getElementById("noDonorsMsg");
const errorMessage = document.getElementById("errorMessage");
const cityFilter = document.getElementById("city");

// Build one donor card's HTML (only ever called for AVAILABLE donors)
function buildDonorCard(d) {
    return (
        "<div class='donor-card' data-blood='" + escapeHtml(d.bloodGroup) + "' data-city='" + escapeHtml(d.city) + "'>" +
            "<div class='donor-info'>" +
                "<h3>" + escapeHtml(d.fullName) + "</h3>" +
                "<p>Blood Group: " + escapeHtml(d.bloodGroup) + "</p>" +
                "<p>City: " + escapeHtml(d.city) + "</p>" +
                "<p>Mobile: " + escapeHtml(d.mobile) + "</p>" +
            "</div>" +
            "<span class='available'>Available</span>" +
        "</div>"
    );
}

// Fill the City dropdown dynamically based on registered donors
function populateCityFilter(donors) {
    const cities = Array.from(new Set(donors.map(d => d.city).filter(Boolean))).sort();
    cityFilter.innerHTML = "<option value=''>Select City</option>";
    cities.forEach(function (c) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        cityFilter.appendChild(opt);
    });
}

// Render all donor cards fresh from localStorage
// ONLY donors the admin currently has as available:true show up here.
// Deleted donors -> gone from the array entirely -> never shown.
// Donors admin marked unavailable -> available:false -> filtered out below.
function renderDonors() {
    const allDonors = getDonors();
    const availableDonors = allDonors.filter(d => d.available !== false);

    populateCityFilter(availableDonors);

    if (availableDonors.length === 0) {
        donorCardsWrap.innerHTML = "";
        noDonorsMsg.style.display = "block";
        return;
    }

    noDonorsMsg.style.display = "none";
    donorCardsWrap.innerHTML = availableDonors.map(buildDonorCard).join("");
}

// Initial render on page load
renderDonors();

// Also refresh automatically if another tab (e.g. Admin dashboard)
// deletes a donor while this page is open
window.addEventListener("storage", function (e) {
    if (e.key === "donors") {
        renderDonors();
    }
});

/* ---------------- SEARCH / FILTER ---------------- */

const searchBtn = document.getElementById('searchBtn');

if (searchBtn) {
    searchBtn.addEventListener('click', function () {

        const selectedBlood = document.getElementById('bloodGroup').value;
        const selectedCity = document.getElementById('city').value;

        const allCards = document.querySelectorAll('.donor-card');
        let matchCount = 0;

        allCards.forEach(function (card) {

            const cardBlood = card.getAttribute('data-blood');
            const cardCity = card.getAttribute('data-city');

            const bloodMatch = (selectedBlood === '' || selectedBlood === cardBlood);
            const cityMatch = (selectedCity === '' || selectedCity === cardCity);

            if (bloodMatch && cityMatch) {
                card.style.display = 'flex';
                matchCount++;
            } else {
                card.style.display = 'none';
            }

        });

        if (matchCount === 0) {
            errorMessage.textContent = 'No donors available for this search';
        } else {
            errorMessage.textContent = '';
        }

    });
}
</script>
</html>
