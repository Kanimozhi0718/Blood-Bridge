<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Home1.html">
    <title>Login</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:url("images/bloodlogin.jpg") no-repeat center center fixed;
    background-size:cover;
    color:#333;
}

/* ================= HEADER ================= */

header{
    width:100%;
    height:10vh;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    background:rgba(244,240,240,0.8);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
     font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo span{
    color:red;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-size:16px;
    font-weight:500;
    transition:.3s;
}

nav a:hover{
    color:red;
}

/* ================= BUTTON ================= */

.nav-btn button{

    width:90px;
    height:38px;

    border:2px solid red;
    border-radius:8px;

    background:white;
    color:red;

    cursor:pointer;
    transition:.3s;
}

.nav-btn button:hover{

    background:red;
    color:white;
    transform:translateY(-2px);

}

/* ================= LOGIN SECTION ================= */

.login-section{

    height:83vh;
    display:flex;
    margin-right: 10vw;
    justify-content:flex-end;
    align-items:center;
    padding:90px 70px 20px;
}

/* ================= FORM ================= */

.form-box{

    width:420px;
    padding:25px;
    margin-top: 3vh;
    border-radius:12px;

    background:rgba(255,255,255,.82);

    border:1px solid red;

    box-shadow:0 5px 15px rgba(228,15,15,.5);

    animation:fadeUp .8s ease;

    transition:.4s;

}

.form-box:hover{

    transform:translateY(-5px);

    box-shadow:0 10px 25px rgba(0,0,0,.2);

}

.form-box h2{

    text-align:center;
    margin-bottom:10px;

}

.subtitle{

    text-align:center;
    color:gray;
    margin-bottom:20px;

}

.input-group{

    margin-top:18px;

}

.form-box label{

    display:block;
    margin-bottom:6px;
    font-weight:bold;

}

.form-box input{

    width:100%;
    padding:10px;

    border:1px solid #ccc;
    border-radius:6px;

    outline:none;

    transition:.3s;

}

.form-box input:focus{

    border-color:red;

    box-shadow:0 0 10px rgba(255,0,0,.25);

}

.show-password-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: -8px;
    margin-bottom: 12px;
}

.show-password-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: #d32f2f; 
}

.show-password-row label {
    margin: 0;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    user-select: none;
}
.error-text{

    color:red;
    font-size:13px;
    display:block;
    margin-top:5px;

}

#loginMessage{

    margin-top:15px;
    text-align:center;
    font-weight:bold;

}

/* ================= LOGIN BUTTON ================= */

.submit-btn{

    width:100%;
    height:42px;

    margin-top:20px;

    border:none;
    border-radius:8px;

    background:red;
    color:white;

    cursor:pointer;

    transition:.3s;

}

.submit-btn:hover{

    background:#b3122a;

    transform:scale(1.03);

}

/* ================= NOTE ================= */

.note{

    text-align:center;

    margin-top:18px;

    color:gray;

}

.note a{

    color:red;
    font-weight:bold;
    text-decoration:none;

}

.note a:hover{

    text-decoration:underline;

}

/* ================= FOOTER ================= */

footer{

  text-align: center;
  padding: 20px;
  background:red;
  color: white;
  margin-top: 40px;

}

/* ================= ANIMATION ================= */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(40px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

/* ================= RESPONSIVE ================= */

@media(max-width:992px){

header{

    padding:15px 20px;
    flex-wrap:wrap;
    height:auto;

}

nav{

    gap:12px;
    flex-wrap:wrap;

}

.login-section{

    justify-content:center;

    padding:140px 20px 60px;

}

.form-box{

    width:100%;

    max-width:420px;

}

}

@media(max-width:600px){

header{

    flex-direction:column;

    text-align:center;

    gap:10px;

}

nav{

    justify-content:center;

}

.form-box{

    padding:25px;

}

}

</style>
    
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="images/blood.png" alt="BloodBridge Logo" width="80">
            <h1>Blood <span>Bridge</span></h1>
        </div>

        <nav>
            <a href="Home1.html">Home</a>
            <a href="About1.html">About</a>
            <a href="contact1.html">Contact</a>
        </nav>

        <div class="nav-btn">
            <a href="Donar.html">
                <button id="registerBtn">Register</button>
            </a>
        </div>
    </header>

    <!-- Login Section -->
    <section class="login-section">

        <div class="form-box">

            <h2>Welcome Back</h2>
            <p class="subtitle">Login to continue your BloodBridge journey.</p>

            <form id="loginForm">

                <!-- Email -->
                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email"
                           id="loginEmail"
                           placeholder="Enter your email"
                           required>
                    <small id="emailError" class="error-text"></small>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="loginPass">Password</label>
                    <input type="password" id="loginPassword"placeholder="Enter your password" required>
                    <small id="passwordError" class="error-text"></small>
                </div>
                <br>
                <div class="show-password-row">
                     <input type="checkbox" id="loginShowPassword">
                     <label for="loginShowPassword">Show Password</label>
                </div>
                

                <!-- Success / Error Message -->
                <p id="loginMessage"></p>

                

                <!-- Login Button -->
                <button type="submit"
                        class="submit-btn"
                        id="loginBtn">
                    Login
                </button>

            </form>

            <p class="note">
                Don't have an account?
                <a href="Donor.html">Register Here</a>
            </p>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 BloodBridge | Donate Blood, Save Lives ❤️</p>
    </footer>

    <script src="script1.js"></script>

</body>

</html>
